<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>상담 신청으로 이동 | 재무해결사</title>
  <link rel="icon" href="/favicon.png" />
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ec;color:#1c3b2e;font-family:'IBM Plex Sans KR',system-ui,sans-serif}main{text-align:center;padding:2rem}a{color:#1c3b2e;font-weight:600}</style>
  <!-- 블로그 안내 링크의 중간 기착지: 방문 통계(블로그 유입·누름)를 남기고 바로 목적지로 보낸다. 동기 로드여야 아래 스크립트가 gtag 를 쓴다. -->
  <script src="/ga.js"></script>
</head>
<body>
<main>
  <p>회계사 상담 신청 화면으로 이동합니다…</p>
  <p><a id="go" href="https://board.finance-fixer.net/consultation">바로 가기 →</a></p>
</main>
<script>
(() => {
  // 주제 미리 선택(블로그 글 테마 → 상담 주제). 목록 밖 값은 버린다.
  const q = new URLSearchParams(location.search);
  const topics = { audit: '회계감사·검토', tax: '세무 상담', etc: '기타 문의' };
  const to = new URL('https://board.finance-fixer.net/consultation');
  const key = q.get('topic');
  if (key && Object.prototype.hasOwnProperty.call(topics, key)) to.searchParams.set('topic', topics[key]);
  if (q.get('utm_source') === 'naver_blog') to.searchParams.set('src', 'naver_blog');
  document.getElementById('go').href = to.toString();
  const a = document.getElementById('go');
  let done = false;
  const go = () => { if (!done) { done = true; location.replace(a.href); } };
  try {
    if (window.__ffGa && window.gtag) window.gtag('event', 'go_consult', { transport_type: 'beacon', event_callback: go, event_timeout: 1500 });
  } catch (e) { /* 통계 실패는 이동에 영향 없음 */ }
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
