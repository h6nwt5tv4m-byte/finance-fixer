<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>카카오톡 상담으로 이동 | 재무해결사</title>
  <link rel="icon" href="/favicon.png" />
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ec;color:#1c3b2e;font-family:'IBM Plex Sans KR',system-ui,sans-serif}main{text-align:center;padding:2rem}a{color:#1c3b2e;font-weight:600}</style>
  <!-- 블로그 안내 링크의 중간 기착지: 방문 통계(블로그 유입·누름)를 남기고 바로 목적지로 보낸다. 동기 로드여야 아래 스크립트가 gtag 를 쓴다. -->
  <script src="/ga.js"></script>
</head>
<body>
<main>
  <p>카카오톡 재무해결사 채널로 이동합니다…</p>
  <p><a id="go" href="https://pf.kakao.com/_mnxlGX">바로 가기 →</a></p>
</main>
<script>
(() => {
  const a = document.getElementById('go');
  let done = false;
  const go = () => { if (!done) { done = true; location.replace(a.href); } };
  try {
    if (window.__ffGa && window.gtag) window.gtag('event', 'go_kakao', { transport_type: 'beacon', event_callback: go, event_timeout: 1500 });
  } catch (e) { /* 통계 실패는 이동에 영향 없음 */ }
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
