{% extends 'base.html' %}{% block main %}<section class="reading"><a class="back" href="/">← 글 목록</a><h1>글쓰기</h1>{% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}
<form method="post" class="stack" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf() }}"><fieldset><legend>공개 범위</legend><label class="radio"><input type="radio" name="visibility" value="public" required {{ 'checked' if request.form.get('visibility','public')=='public' }}> 공개글</label><label class="radio"><input type="radio" name="visibility" value="private" {{ 'checked' if request.form.get('visibility')=='private' }}> 비밀글</label><p class="hint">비밀글은 작성자와 운영자만 제목·본문·댓글을 볼 수 있습니다.</p></fieldset>
<label>제목<input name="title" required maxlength="100" value="{{ request.form.get('title','') }}"></label><label>본문<textarea rows="9" name="body" required maxlength="4000">{{ request.form.get('body','') }}</textarea></label><label>사진 <span class="hint">(선택 · 3장까지, 한 장 5MB · JPG·PNG·WebP·HEIC)</span><input type="file" name="images" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple></label><p class="hint">사진의 촬영 위치·기기 정보는 지우고 저장합니다. 주민등록번호, 연락처, 계좌번호, 고객 자료가 보이는 글과 사진은 올리지 마세요. 다른 사람의 개인정보·사생활·명예를 침해하는 글과 사진은 요청을 받으면 바로 내리거나 가립니다.</p><button class="button">글 등록</button></form></section>{% endblock %}
