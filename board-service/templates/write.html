{% extends 'base.html' %}{% block main %}<section class="reading"><a class="back" href="/">← 글 목록</a><h1>글쓰기</h1>{% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}
<form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf() }}"><fieldset><legend>공개 범위</legend><label class="radio"><input type="radio" name="visibility" value="public" required {{ 'checked' if request.form.get('visibility','public')=='public' }}> 공개글</label><label class="radio"><input type="radio" name="visibility" value="private" {{ 'checked' if request.form.get('visibility')=='private' }}> 비밀글</label><p class="hint">비밀글은 작성자와 운영자만 제목·본문·댓글을 볼 수 있습니다.</p></fieldset>
<label>제목<input name="title" required maxlength="100" value="{{ request.form.get('title','') }}"></label><label>본문<textarea rows="9" name="body" required maxlength="4000">{{ request.form.get('body','') }}</textarea></label><p class="hint">주민등록번호, 연락처, 고객 자료는 입력하지 마세요.</p><button class="button">글 등록</button></form></section>{% endblock %}
