<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자유게시판 · 재무해결사</title><link rel="stylesheet" href="{{ url_for('static',filename='board.css') }}"></head>
<body><header><div class="sitebar"><a class="brand" href="https://finance-fixer.net/">재무해결사</a><nav aria-label="게시판 메뉴"><a href="{{ url_for('index') }}">자유게시판</a>{% if uid %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="plain">로그아웃</button></form>{% else %}<a href="{{ url_for('login') }}">로그인</a>{% endif %}</nav></div></header>

<footer><a href="https://finance-fixer.net/">재무해결사 홈페이지</a><a href="https://finance-fixer.net/privacy/#board">개인정보처리방침</a></footer></body></html>
