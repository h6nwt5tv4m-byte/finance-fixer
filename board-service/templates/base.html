<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>자유게시판 · 재무해결사</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
</head>
<body>
  {% include 'site_header.html' %}
  <main>
    <nav class="account" aria-label="게시판 계정">
      {% if admin %}<a href="{{ url_for('moderation') }}">차단 관리</a>{% endif %}
      {% if uid %}
      <a href="{{ url_for('account', return_to=back) }}">{{ label(uid) }}</a>
      <form method="post" action="{{ url_for('logout') }}">
        {% if back %}<input type="hidden" name="return_to" value="{{ back }}">{% endif %}<input type="hidden" name="csrf" value="{{ csrf() }}">
        <button type="submit" class="plain">로그아웃</button>
      </form>
      {% else %}
      <a href="{{ url_for('login') }}">로그인</a>
      {% endif %}
    </nav>
    {% for note in get_flashed_messages() %}<p class="notice" role="status">{{ note }}</p>{% endfor %}
    {% block main %}{% endblock %}
  </main>
  <footer>
    <a href="https://finance-fixer.net/">재무해결사 홈페이지</a>
    <a href="https://finance-fixer.net/privacy/#board">개인정보처리방침</a>
  </footer>
</body>
</html>
