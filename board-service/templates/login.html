{% extends 'base.html' %}{% block main %}<section class="narrow"><a class="back" href="/">← 글 목록</a><h1>이메일 인증</h1>
<p>한 번 로그인하면 홈페이지와 자유게시판에서 같은 별명을 사용합니다. 북웜에서는 다른 기기에서도 읽던 곳을 이어갈 수 있습니다.</p>
{% if pending %}<form class="stack" method="post" action="{{ url_for('confirm') }}">{% if back %}<input type="hidden" name="return_to" value="{{ back }}">{% endif %}<input type="hidden" name="csrf" value="{{ csrf() }}"><label>인증번호<input type="text" name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus></label><button class="button">번호 확인</button></form>{% endif %}
<form class="stack" method="post" action="{{ url_for('request_code') }}">{% if back %}<input type="hidden" name="return_to" value="{{ back }}">{% endif %}<input type="hidden" name="csrf" value="{{ csrf() }}"><label>이메일 주소<input type="email" name="email" required maxlength="254" autocomplete="email" placeholder="name@example.com"></label><button class="button {{ 'quiet' if pending }}">{% if pending %}인증번호 다시 받기{% else %}인증번호 받기{% endif %}</button></form>
<p class="hint">메일함과 스팸함을 확인해 주세요. <a href="https://finance-fixer.net/privacy/#board">이메일 처리 안내</a></p></section>{% endblock %}
