{% extends 'base.html' %}{% block main %}<section class="reading"><a class="back" href="{{ url_for('index',view='mine') }}">← 내 글</a><h1>숨김 처리된 내 글·댓글</h1>
{% for item in items %}<form class="stack" method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="id" value="{{ item.id }}"><input type="hidden" name="kind" value="{{ item.kind }}"><div><span class="hint">{{ '댓글' if item.kind=='comment' else '글' }} · {{ item.created|day }} · {{ item.id[:8] }}</span><h2>{{ item.heading }}</h2><p class="bodytext">{{ item.text }}</p></div><details><summary>삭제</summary><button class="button quiet">삭제 확인</button></details></form>{% else %}<p>숨김 처리된 글이나 댓글이 없습니다.</p>{% endfor %}</section>{% endblock %}
